<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">

        <div>
            <label for="user">Username</label>
            <input type="text" name="user" id="user"><br>
        </div>
        <div>
            <label for="pass">password</label>
            <input type="password" name="pass" id="pass"><br>

        </div>
        <div>
            <label for="city">city of employment</label>
            <input type="text" name="city" id="city"><br>
        </div>
        <div>
            <label for="web">web server</label>
            <select name="web" id="web">
                <option value="null"><-- choose server--></option>
                <option value="google">google</option>
                <option value="microsoft">microsoft</option>
                <option value="chrome">chrome</option>
            </select><br>

        </div>
        <div>
            <label for="role">pleace specify your role</label><br>
            <input type="radio" name="role" id="role">Admin <br>
            <input type="radio" name="role" id="role">Engineer <br>
            <input type="radio" name="role" id="role">Manager <br>
            <input type="radio" name="role" id="role">Guest <br>

        </div>
        <div>
            <label for="sign">single sign on the following</label><br>
            <input type="checkbox" name="sign" id="sign">Mail <br>
            <input type="checkbox" name="sign" id="sign">Payroll <br>
            <input type="checkbox" name="sign" id="sign">Selfservice <br>
        </div>
        <div>
            <input type="submit" name="" id="" value="login">
            <input type="reset" name="" id="" value="reset">

        </div>
    </form>
</body>
</html>
