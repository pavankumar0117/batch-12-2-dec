<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        tr,
        td,
        th{
            border: 5px solid black;
            border-collapse: collapse;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>border collapse</h1>
    <table>
        <tr>
            <th>name </th>
            <th>email</th>
            <th>city</th>
        </tr>
        <tr>
            <td>pavan</td>
            <td>pavan@gmail.com</td>
            <td>bengaluru</td>
        </tr>
        <tr>
            <td>yash</td>
            <td>yash@gmail.com</td>
            <td>mangaluru</td>
        </tr>
    </table>
</body>
</html>
