<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        nav{
            background-color: slategray;
            height: 60px;
        }
        nav .container{
            width: 80%;
            height: 100%;
         
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;

        }
        nav a.logo{
            text-decoration: none;
            color: #fff;
            font-style: 1.6em;
        }
        nav .menu a{
            text-decoration: none;
            padding: 8px 10px;
            border: 2px solid #fff;
            cursor: pointer;
            color: #fff;
        }
        nav .menu a:hover{
            background-color: #fff;
            color: antiquewhite;
        }
    </style>
</head>
<body>
    
    <nav>
        <div class="container">
            <a href="#" class="logo">logo here</a>
            <div class="menu">
                <a href="#">home</a>
                <a href="#">about</a>
                <a href="#">service</a>
                <a href="#">contact</a>
            </div>
        </div>
        <h1>border to ancher tag</h1>
    </nav>
    <h1></h1>
</body>
</html>
