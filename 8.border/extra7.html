<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }

        html{
            scroll-behavior: smooth;
        }

        body{
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            height: 100%;
        }
        .container{
            width: 80%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .container .card{
            border: 2px solid green;
            padding: 20px;
            border-radius: 10px;
        }

        .container .card img{
            max-width: 100%;
            border-radius: 10px;
        }
        .card h4{
            text-align: center;
            text-transform: uppercase;
        }

        .card button{
            padding: 10px 20px;
        border:2px solid rebeccapurple ;   
        font-size: 1.2rem;
        cursor: pointer;
        border-radius: 10px;     
    }
    </style>
</head>
<body>
    <section class="container">
        <div class="card">
            <img src="http://picsum.photos/id/123/500/500" alt=" no pic">
            <div class="content">
                <h4>Product-1</h4>
                <button>Add to cart</button>
            </div>
        </div>


        <div class="card">
            <img src="http://picsum.photos/id/124/500/500" alt=" no pic">
            <div class="content">
                <h4>Product-2</h4>
                <button>Add to cart</button>
            </div>
        </div>

        <div class="card">
            <img src="http://picsum.photos/id/125/500/500" alt=" no pic">
            <div class="content">
                <h4>Product-3</h4>
                <button>Add to cart</button>
            </div>
        </div>
    </section>
</body>
</html>
