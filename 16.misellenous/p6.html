<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 100%;
            height: 100vh;
            background-color: #222;
            padding: 20px;
            position: relative;
        }
        section div{
            width: 300px;
            height: 300px;
            position: absolute;
            top: 0;
        }
        .b1{
            background-color: orange;
            margin: 200px;
            z-index: 2;

        }
        .b2{
            background-color: blue;
            margin: 150px;
            z-index: 3;
        }
        .b3{
            background-color: yellowgreen;
            margin: 250px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <h1>z-index</h1>
    <section class="container">
        <div class="b1">block-1</div>
        <div class="b2">block-2</div>
        <div class="b3">block-3</div>
    </section>
</body>
</html>
