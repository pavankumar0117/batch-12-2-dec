<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .table,
        tr,
        th,
        td{
            border: 2px solid slateblue;
            border-collapse: collapse;
        }
        td,th{
            padding: 10px;
            
        }
        .table{
            caption-side: bottom;
            /* caption-side : bottom and top */
        }

    </style>
</head>
<body>
    <h1>Caption-side</h1>
    <table class="table">
        <caption>table 1.1 user table</caption>
        <tr>
            <th>NAme</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>pavan</td>
            <td>ex@gmail.com</td>
        </tr>
        <tr>
            <td>surya</td>
            <td>surya@gmail.com</td>
        </tr>
    </table>
</body>
</html>
