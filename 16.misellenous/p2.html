<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;

        }
        body{
            width: 100%;
            height: 100vh;
            margin: 0;padding: 0;
            overflow-x: hidden;
        }
        .container{
            width: 100%;
            height: 100%;
            border-image: url("https://fastly.picsum.photos/id/1014/1600/1000.jpg?hmac=J5JDGuNTZGGrfSD4dqQfDg4sTRdZfmLuwdGEiAm2gqc");
            backdrop-filter: blur(3px);
            position: relative;
            padding: 10px;
        }
        .container .box{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background-color:rgba(255, 68, 0, 0.3);
            width: 40%;
            height: 40px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>backdrop-filter</h1>
            <h1>welcome to css</h1>
        </div>
    </div>
</body>
</html>-
