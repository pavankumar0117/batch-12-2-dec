<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form div{
            margin: 10px;
          border: solid green;
          padding: 10px;
          width: 100%;
        }
        input{
            width: 100%;
        }
        label{
            color: blue;
        }
    </style>
</head>
<body>
    <h1>range</h1>
    <form action="">
        <div>
            <label for="">select range</label>
            <input type="range" name="weight" id="weight" value="0" min="0" max="100" step="0.5" onchange="getval()">
            <strong id="out"></strong>
        </div>
    </form>
    <script>
        var weightEl=document.getElementById("weight");
        var outel=document.getElementById("out");
        function getval(){
            outel.innerText=weightEl.value+" kg";
        };

    </script>
</body>
</html>
