<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 80%;
            margin: auto;
        }
        .container .prev{
            float: left;
        }
        .container .next{
            float: right;
        }
    </style>
</head>
<body>
    <h1>float</h1>
    <div class="container">
        <button class="prev">Previous</button>
        <button class="next">next</button>
    </div>
</body>
</html>
