<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 300px;
            width: 300px;
            background-color: teal;
            position: absolute;
        }

        .effect{
            position: absolute;
            top: 50%;
            left: 50%;
            background-color: orange;
            height: 60px;
            width: 60px;
            transform: translate(-50%,-50%);
            transition: all 3s;
        }
        .effect:hover{
            transform: rotate(180deg);
            transform-origin: 50% 0%;
        }
    </style>
</head>
<body>
    <h1>transform - origin</h1>
    <div class="box">
        <dov class="effect"></dov>
    </div>
</body>
</html>
