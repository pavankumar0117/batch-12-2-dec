<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>data list</h1>
    <form action="">
        <div>
            <label for="city">choose city name </label>
            <input type="text" name="city" id="city" list="citynames">
        </div>
    </form>
    <datalist id="citynames">
        <option value="bengaluru"></option>
        <option value="manglore"></option>
        <option value="mysuru"></option>
        <option value="mandya"></option>

    </datalist>
</body>
</html>
