<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block{
            height: 100vh;
            width: 100%;
            background-color: slateblue;
        }
        @media screen and (min-width:375px) and (max-width:667px) and (-webkit-min-device-pixel-ratio:2) {
            .block{
                background-color: orange;
            }
        }
        @media screen and (min-width:375px) and (max-width:667px) and (-webkit-min-device-pixel-ratio:2) and (oriantation: landscape){
            .block{
                background-color: palevioletred;
            }
        }
    </style>
</head>
<body>
    <div class="block"></div>
</body>
</html>
