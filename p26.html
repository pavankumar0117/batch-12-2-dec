<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Select technologies</h1>
    <form action="">
        <div>
            <label for="tech">your technologies </label>
            <select name="tech" id="tech">
                <option value="null">choose technologies</option>
                
                <option value="html">html</option>
                <option value="css">css</option>
                <option value="react">React js</option>
            </select>
        </div>
        <hr>
       <div>
        <label for="tech">your technologies</label>
        <select name="tech" id="tech" multiple>
            <option value="html ">html</option>
            <option value="css ">css</option>
            <option value="js">js</option>
            <option value="react">react</option>
        </select>
        <div>
            <label for="tech">your technologies </label>
            <select name="tech" id="tech" >
                <option value="null">choose technologies</option>
                <optgroup label="frontend technologies"> 
                    <option value="html">html</option>
                <option value="css">css</option>
                <option value="react">React js</option>
                </optgroup>

                
                <optgroup label="backend technologies"> 
                    <option value="java">java</option>
                <option value="python">python</option>
                <option value="mern">mern</option>
                </optgroup>
                
            </select>
        </div>
       </div>
    </form>
</body>
</html>
