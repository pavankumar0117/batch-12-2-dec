<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #can{
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <h1>emoji using canvas</h1>
    <canvas id="can" height="400" width="400"></canvas>
    <script>
        function drawCanvas(){
            var canEl = document.getElementById("can")
            var ctx = canEl.getContext("2d")

            ctx.beginPath();
            //arc(x,y,radius,startangle,end angle,boolean)  true-clockwise, false-anticlock
            ctx.arc(75,75,50,0,Math.PI*2,true)
            ctx.moveTo(100,75)

            ctx.arc(75,75,35,0,Math.PI,false)
            ctx.moveTo(65,65)

            ctx.arc(60,65,5,0,Math.PI*2,true)
            ctx.moveTo(95,95)

            ctx.arc(95,65,5,0,Math.PI*2,true)
            ctx.stroke()
        }
        drawCanvas()
    </script>
</body>
</html>
