<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    table{
        width: 80%;
        height: 100%;
        border-collapse: collapse;
        margin: auto;
        text-align: center;
    }
    table,tr,th,td{
        border: 1px solid black;
        border-collapse: collapse;
    }
    td,th{
        padding: 10px;
    }
    th{
        background-color:lightblue;

    }
    tr{
        background-color: bisque;
    }
      
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Device</th>
            <th>brand</th>
            <th colspan="2">Specification</th>
        </tr>
        <tr>
            <td rowspan="3">smartphone</td>
            <td rowspan="3">Apple</td>
            <td>Model</td>
            <td>Storage</td>
        </tr>
        <tr>
            <td>i phone 12 pro</td>
            <td>256 gb</td>
        </tr>
        <tr>
            <td>i phone se</td>
            <td>128 gb</td>
        </tr>
        <tr>
            <td>laptop</td>
            <td>HP</td>
            <td colspan="2">15.6"Display</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>Samsung</td>
            <td colspan="2">10.5"Display</td>
        </tr>
    </table>
</body>
</html>
