    <title>Document</title>
    <style>
    table{
        width: 80%;
        height: 100%;
        border-collapse: collapse;

    }
    td,th{
        padding: 10px;
    }
    th{
        background-color:lightblue;

    }
    tr{
        background-color: bisque;
    }
      
    </style>
</head>
<body>

        <tr>

            <td>2:30</td>
        </tr><tr>

        </tr>

</html>
