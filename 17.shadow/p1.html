<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 1050px;
            margin: auto;
            padding: 20px;
            overflow-x: hidden;
            background-color: rosybrown;
            display: flex;
            flex-wrap: wrap;

        }

        .container div{
            background-color: #f50e0e;
            width: 150px;
            height: 150px;
            margin: 15px;

        }
        .b1{
            /* box-shadow:x y blur-radius color; */
            box-shadow: 15px 12px 10px rgba(194, 38, 77, 0.3);
        }
        .b2{
            box-shadow: 15px 12px 10px rgba(250, 50, 30, 0.3);
        }
        .b3{
            box-shadow: 15px 12px 10px rgba(250, 50, 10, 0.3);
        }
        .b4{
            box-shadow: 15px 12px 10px rgba(250, 50, 0, 0.3);
        }
        .b5{
            box-shadow: 15px 12px 10px rgba(250, 20, 10, 0.3);
        }
        .b6{
            box-shadow: 15px 12px 10px rgba(250, 20, 70, 0.3);
        }
        .b7{
            box-shadow: rgba(240, 46, 170, 0.4) 5px 5px, rgba(240, 46, 170, 0.3) 10px 10px, rgba(240, 46, 170, 0.2) 15px 15px, rgba(240, 46, 170, 0.1) 20px 20px, rgba(240, 46, 170, 0.05) 25px 25px;
        }
    </style>
</head>
<body>
    <h1>box shadow</h1>
    <div class="container">
        <div class="b1">block</div>
        <div class="b2">block</div>
        <div class="b3">block</div>
        <div class="b4">block</div>
        <div class="b5">block</div>
        <div class="b6">block</div>
        <div class="b7">block</div>

    </div>






</body>
</html>
