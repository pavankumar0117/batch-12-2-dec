<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #fff;
            overflow-x: hidden;
        }
        .container{
            width: 100%;
            height: 100%;
            background-color: orangered;
            padding: 10px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: start;
            /* start , end, flex-start, flex-end , center, baseline , stretch */
            /* align the flexboxs vertically when direction is row /
            horizontal when direction is column */
        }
        .container .card{
            background-color: slateblue;
            margin: 5px;
            height: auto;
            width: 200px;
            color: #fff;
            padding: 20px;

        }



    </style>
</head>
<body>
    <section class="container">
        <div class="card">block-1</div>
        <div class="card">block-2</div>
        <div class="card">block-3</div>
    </section>
</body>
</html>
