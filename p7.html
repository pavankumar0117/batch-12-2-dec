<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>marquee tag</h1>
    <!--
    moving text 
    direction -4- up,down,right,left
    behaviour scroll,slide ,alternate,alternate scroll,alternate-slide
    scrolldlay-delay time
    scrollamount-(0-100)-speed of movement

    -->
    <marquee behavior="scroll" direction="">this is scrolling text</marquee>
    <marquee behavior="slide" direction="">this is scrolling text</marquee>
    <marquee behavior="alternate" direction="">this is scrolling text</marquee>
    <marquee behavior="alternate-scroll" direction="">this is scrolling text</marquee>
    <marquee behavior="alternate-slide" direction="">this is scrolling text</marquee>
    <hr>
    <marquee behavior="scroll" direction="right">right moving text</marquee>
    <marquee behavior="scroll" direction="up">right moving text</marquee>
    <marquee behavior="scroll" direction="down">right moving text</marquee>
    <h3>speed</h3>
    <marquee behavior="scroll" direction="right"scrollamount="10">speed of text</marquee>
</body>
</html>
