<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            padding: 10px;
            font-size: 1.2rem;
            margin: 30px;
            border: 4px solid red;
            outline-width: 10px;
            outline-color: greenyellow;
            outline-offset: 3px;
        }
        .b1{outline-style: solid;}
        .b2{outline-style: dotted;}
        .b3{outline-style: dashed;}
        .b4{outline-style: inset;}
        .b5{outline-style: outset;}
        .b6{outline-style: groove;}
        .b7{outline-style: ridge;}
        .b8{outline-style: double;}
    </style>
</head>
<body>
    <h1>Outline</h1>
    <p class="b1">solid</p>
    <p class="b2">dotted</p>
    <p class="b3">dashed</p>
    <p class="b4">inset</p>
    <p class="b5">outset</p>
    <p class="b6">groove</p>
    <p class="b7">ridge</p>
    <p class="b8">double</p>
</body>
</html>
