<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 500px;
            height: 200px;
            padding: 20px;
            margin: 10px;
            border: 2px solid black;
        }
        .b1{
            background-image: repeating-radial-gradient(orange,slateblue);
        }
        .b2{
            background-image: repeating-radial-gradient(orange 50%,slateblue);
        }
        .b3{
            background-image: repeating-radial-gradient(closest-side,orange,slateblue,green);
        }
        .b4{
            background-image: repeating-radial-gradient(circle at 50%,green 50px,orange 20px,slateblue 20px);
        }
        .b5{
            background-image: repeating-radial-gradient(ellipse at 80%,orange 30px,slateblue 20px,pink 50px);
        }
        .b6{
            background-image: repeating-radial-gradient(circle at 20%,orange 30px,slateblue 50px);
        }
        .b7{
            background-image: repeating-radial-gradient(circle at 50%,orange 10px ,slateblue 20px,green 10px);
        }
        .b8{
            background-image: repeating-radial-gradient(ellipse at 80%,orange,slateblue);
        }





    </style>
</head>
<body>
    <h1>repeating radial-gradient </h1>
    <div class="b1"><b><h1>block</h1></b></div>
    <div class="b2"></div>
    <div class="b3"></div>
    <div class="b4"></div>
    <div class="b5"></div>
    <div class="b6"></div>
    <div class="b7"></div>
    <div class="b8"></div>
</body>
</html>
