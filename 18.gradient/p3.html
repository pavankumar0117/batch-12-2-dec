<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 500px;
            height: 200px;
            padding: 30px;
            border: 2px solid black;
            margin: 10px;
        }
        .b1{
            background-image: repeating-linear-gradient(red,yellow);
        }

        .b2{
            background-image: repeating-linear-gradient(60deg,red,yellow,green);
        }
        .b3{
            background-image: repeating-linear-gradient(0.4turn,red,yellow);
        }
        .b4{
            background-image: repeating-linear-gradient(to top right,red,yellow,blue);
        }
        .b5{
            background-image: repeating-linear-gradient(to top left,red,yellow);
        }
        .b6{
            background-image: repeating-linear-gradient(to bottom left,red,yellow,rosybrown);
        }
        .b7{
            background-image: repeating-linear-gradient(to bottom right,red,yellow,brown);
        }
        .b8{
            background-image: repeating-linear-gradient(to right ,red,yellow);
        }
        
    </style>
</head>
<body>
    <h1>repeating linear-gradient </h1>
    <div class="b1"><b><h1>block</h1></b></div>
    <div class="b2"></div>
    <div class="b3"></div>
    <div class="b4"></div>
    <div class="b5"></div>
    <div class="b6"></div>
    <div class="b7"></div>
    <div class="b8"></div>
</body>
</html>
