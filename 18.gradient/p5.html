<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 500px;
            height: 200px;
            padding: 30px;
            border: 2px solid black;
            margin: 10px;
        }
        .b1{
            background-image: repeating-conic-gradient(red,orange,slateblue);
        }
        .b2{
            background-image: repeating-conic-gradient(red 10%,orange 20%,slateblue 30%);
        }
        .b3{
            background-image: repeating-conic-gradient(from 60deg at 10% 50%,red 10%,orange 40%,slateblue 50%);
        }
        .b4{
            background-image: repeating-conic-gradient(from 120deg at 50% 50%,red 10%,orange 20%,slateblue 50%);
        }
        .b5{
            background-image: repeating-conic-gradient(from 120deg at 90% 30%,red 0deg 10deg,orange 10deg 30deg,slateblue 30deg 60deg);
        }
        .b6{
            background-image: repeating-conic-gradient(from 200deg at 100% 40%,red 0deg 10deg,orange 10deg 30deg,slateblue 30deg 60deg);
        }
        .b7{
            background-image: repeating-conic-gradient(from 50deg at 90% 0%,red 0deg 10deg,orange 10deg 30deg,slateblue 30deg 60deg);
        }
        .b8{
            background-image: repeating-conic-gradient(from 120deg at 0% 30%,red 0deg 10deg,orange 10deg 30deg,slateblue 30deg 60deg);
        }




    </style>
</head>
<body>
    <h1>repeating conic-gradient </h1>
    <div class="b1"></div>
    <div class="b2"></div>
    <div class="b3"></div>
    <div class="b4"></div>
    <div class="b5"></div>
    <div class="b6"></div>
    <div class="b7"></div>
    <div class="b8"></div>
</body>
</html>
