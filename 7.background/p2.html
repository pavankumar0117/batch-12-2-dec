<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            gap: 20px;
        }
        .container div{
            width: 100px;
            height: 100px;
            padding: 20px;
        }
        .b1{
            background-color:hsl(100, 25%, 40%);
        }
        .b2{
            background-color: #3d4f4f65;
        }
        .b3{
            background-color: yellow;
        }
        .b4{
            background-color: green;
        }
        .b5{
            background-color:rgb(0, 33, 45);
        }
        .b6{
            background-color: rgba(0, 31, 23, 0.4);
        }

    </style>
</head>
<body>
    <section class="container">
        <div class="b1">block</div>
        <div class="b2">block</div>
        <div class="b3">block</div>
        <div class="b4">block</div>
        <div class="b5">block</div>
        <div class="b6">block</div>
    </section>
</body>
</html>
